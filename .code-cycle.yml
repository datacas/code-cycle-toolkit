code_cycle:
  issue_provider: github
  code_host: github
  worktree_dir: .worktree
  repository:
    selector: datacas/code-cycle-toolkit
    default_branch: main
  review:
    # The provider identities whose comments may advance recovered findings.
    # Provider logins are compared case-insensitively. An absent or empty list
    # must block recovery rather than treating contract state as finding-free.
    trusted_authors:
      - datacas
  profiles:
    cheap_coder:
      primary: "codex:openai/gpt-6-luna high"
      fallback: "claude:anthropic/claude-sonnet-5-5 high"

    deep_coder:
      primary: "codex:openai/gpt-6.1-sol medium"
      fallback: "claude:anthropic/claude-opus-5-5 high"

    reviewer:
      primary: "claude:anthropic/claude-sonnet-5-5 high"
      fallback: "codex:openai/gpt-6-luna high"

    senior_reviewer:
      primary: "claude:anthropic/claude-opus-5-5 high"
      fallback: "codex:openai/gpt-6.1-sol medium"

    security:
      primary: "claude:anthropic/claude-opus-5-5 high"
      fallback: "codex:openai/gpt-6.1-sol high"

    coordinator:
      primary: "claude:anthropic/claude-sonnet-5-5 medium"
      fallback: "codex:openai/gpt-6-luna medium"

    auxiliary_tool:
      primary: "codex:openai/gpt-6-luna medium"

    cheap_tool:
      primary: "claude:anthropic/claude-sonnet-5-5 low"
      fallback: "codex:openai/gpt-6-luna low"

  routing:
    strategy: measured

  orchestration:
    mode: auto        
  # Experimental candidates for a reviewer comparison that has not run yet.
  # `reviewer_b` matches the default `reviewer` profile (gpt-6-sol high), so
  # the comparison asks whether `reviewer_a` could replace it; nothing presumes
  # which is better, the calibration decides that. This is the only place an
  # alias maps to a provider and model, so a candidate can be swapped without
  # editing a skill.
  calibration:
    profiles:
      reviewer_a:
        provider: anthropic
        model: claude-sonnet-5
        effort: high
      reviewer_b:
        provider: openai
        model: gpt-6-sol
        effort: high
