code_cycle:
  issue_provider: github
  code_host: github
  repository:
    selector: datacas/code-cycle-toolkit
    default_branch: main
  review:
    # The provider identities whose comments may advance recovered findings.
    # Provider logins are compared case-insensitively. An absent or empty list
    # must block recovery rather than treating contract state as finding-free.
    trusted_authors:
      - datacas
  # Experimental candidates for a reviewer comparison that has not run yet.
  # `reviewer_b` matches the default `reviewer` profile (gpt-6-sol high), so
  # the comparison asks whether `reviewer_a` could replace it; nothing presumes
  # which is better, the calibration decides that. This is the only place an
  # alias maps to a provider and model, so a candidate can be swapped without
  # editing a skill.
  calibration:
    profiles:
      reviewer_a:
        provider: anthropic
        model: claude-sonnet-5
        effort: high
      reviewer_b:
        provider: openai
        model: gpt-6-sol
        effort: high
